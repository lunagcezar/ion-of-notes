# Production stack: Caddy terminates TLS and the app is only reachable on the
# internal network. Copy `.env.prod.example` to `.env.prod`, set the domain and
# create `secrets/owner_password.txt`, then run:
#
#   docker compose -f compose.prod.yml --env-file .env.prod up -d --build
#
# For a local HTTPS test use `deploy/Caddyfile.local` and a localhost domain:
#
#   ION_OF_NOTES_CADDYFILE=./deploy/Caddyfile.local \
#   ION_OF_NOTES_DOMAIN=localhost \
#   docker compose -f compose.prod.yml --env-file .env.prod up -d --build
services:
  ion-of-notes:
    build:
      context: .
    image: ${ION_OF_NOTES_IMAGE:-ion-of-notes-server:local}
    restart: unless-stopped
    init: true
    expose:
      - "8787"
    environment:
      ION_OF_NOTES_OWNER_PASSWORD_FILE: /run/secrets/owner_password
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
    secrets:
      - owner_password
    volumes:
      - ion-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2@sha256:ce773ec7a742ce15ee6bf2bb5f65882b9e2a4487b10733e6f1484f86e6b5d8bc
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ION_OF_NOTES_DOMAIN: ${ION_OF_NOTES_DOMAIN:?set ION_OF_NOTES_DOMAIN in .env.prod}
    volumes:
      - ${ION_OF_NOTES_CADDYFILE:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      ion-of-notes:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backup:
    image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    profiles: ["backup"]
    restart: unless-stopped
    volumes:
      - ion-data:/data:ro
      - ./backups:/backups
    environment:
      ION_OF_NOTES_BACKUP_RETENTION_DAYS: ${ION_OF_NOTES_BACKUP_RETENTION_DAYS:-7}
    command: >
      sh -c 'apk add --no-cache sqlite >/dev/null &&
      while true; do
        sqlite3 /data/ion-of-notes.sqlite3 ".backup '/backups/ion-of-notes-$$(date +%Y%m%d-%H%M%S).sqlite3'";
        find /backups -name "ion-of-notes-*.sqlite3" -mtime +$${ION_OF_NOTES_BACKUP_RETENTION_DAYS} -delete;
        sleep 86400;
      done'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  ion-data:
    name: ion-of-notes-data
  caddy-data:
  caddy-config:

secrets:
  owner_password:
    file: ./secrets/owner_password.txt
