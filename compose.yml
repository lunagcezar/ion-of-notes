# Self-hosted server stack. Copy `secrets/owner_password.txt.example` to
# `secrets/owner_password.txt`, set a strong password, then run
# `docker compose up --build`.
#
# The image healthcheck probes `/health`; the named volume keeps the SQLite
# workspace and collaboration state across container recreation.
services:
  ion-of-notes:
    build:
      context: .
    image: ion-of-notes-server:local
    restart: unless-stopped
    init: true
    ports:
      # Loopback by default: put a TLS reverse proxy in front for network
      # access, or set ION_OF_NOTES_BIND=0.0.0.0 deliberately.
      - "${ION_OF_NOTES_BIND:-127.0.0.1}:${ION_OF_NOTES_PORT:-8787}:8787"
    environment:
      ION_OF_NOTES_OWNER_PASSWORD_FILE: /run/secrets/owner_password
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
    secrets:
      - owner_password
    volumes:
      - ion-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ion-data:
    name: ion-of-notes-data

secrets:
  owner_password:
    file: ./secrets/owner_password.txt
