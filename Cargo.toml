[package]
name = "ion-of-notes"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
eframe = "0.37"
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hmac = "0.12"
sha2 = "0.10"
rust-i18n = "3"
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.dev]
opt-level = 0

# Ship a smaller, faster binary: thin LTO lets the egui/eframe code inline
# across crates without the build cost of full LTO.
[profile.release]
lto = "thin"
codegen-units = 1
