[package]
name = "ion-of-notes"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
eframe = "0.37"
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hmac = "0.12"
sha2 = "0.10"
rust-i18n = "3"

[profile.dev]
opt-level = 0

# Ship a smaller, faster binary: thin LTO lets the egui/eframe code inline
# across crates without the build cost of full LTO.
[profile.release]
lto = "thin"
codegen-units = 1
