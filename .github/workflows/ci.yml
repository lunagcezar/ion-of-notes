name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (core)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Tests
        run: pwsh -File scripts/check-tests.ps1

      - name: Release build
        run: cargo build --release --locked

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build server image
        run: docker build -t ion-of-notes-server:ci .

      - name: Smoke test
        run: |
          set -euo pipefail
          docker run -d --name ion-ci -p 18787:8787 \
            -e ION_OF_NOTES_OWNER_PASSWORD=test-password \
            -v ion-ci-data:/data ion-of-notes-server:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18787/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18787/ready
          curl -fsS http://127.0.0.1:18787/health
          curl -fsS http://127.0.0.1:18787/metrics | grep -q 'ion_of_notes_up 1'

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ion-ci || true
          docker volume rm ion-ci-data || true

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"

      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
