name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"

      - name: Cache Rust
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8

      - name: Build headless server
        run: cargo build --release --locked --no-default-features --bin ion-of-notes-server

      - name: Package
        run: |
          set -euo pipefail
          strip target/release/ion-of-notes-server
          tar -czf "ion-of-notes-server-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/release ion-of-notes-server

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "ion-of-notes-server-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" --clobber

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99.1"

      - name: Cache Rust
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8

      - name: Build desktop and server
        run: |
          cargo build --release --locked
          cargo build --release --locked --no-default-features --bin ion-of-notes-server

      - name: Package desktop
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/ion-of-notes.exe `
            -DestinationPath "ion-of-notes-${env:GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip" -Force

      - name: Package server
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/ion-of-notes-server.exe `
            -DestinationPath "ion-of-notes-server-${env:GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip" -Force

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --generate-notes
          }
          gh release upload $env:GITHUB_REF_NAME `
            "ion-of-notes-${env:GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip" `
            "ion-of-notes-server-${env:GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip" --clobber

  checksums:
    needs: [linux-server, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --dir dist --clobber
          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
              | sort | xargs sha256sum > SHA256SUMS
            cat SHA256SUMS
          )
          gh release upload "$GITHUB_REF_NAME" dist/SHA256SUMS --clobber

